[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bytesz"
version = "0.2.0"
description = "Strict two-way conversion between byte counts and human sizes with explicit IEC and SI units"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["bytes", "size", "human", "iec", "si", "kib", "mib", "numfmt", "parse", "format"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
bytesz = "bytesz._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/bytesz"
Issues = "https://github.com/JaviLianes8/bytesz/issues"
Changelog = "https://github.com/JaviLianes8/bytesz/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
exclude = ["IMPROVEMENTS-round*.md", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/bytesz"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
